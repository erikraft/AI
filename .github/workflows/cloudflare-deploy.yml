# Retirement tombstone for the legacy Cloudflare deployment workflow.
# The Cloudflare Worker was removed in PR #48. Keep this path harmless so a
# stale GitHub Actions registration cannot call the removed Deploy Hook.
# Do not add deployment commands, Cloudflare API requests, or secrets here.
name: Cloudflare Workers Deploy Hook
run-name: Cloudflare deployment retired (no-op)

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Cloudflare deployment is retired
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo 'Cloudflare deployment is retired; Vercel is the active web backend.'
